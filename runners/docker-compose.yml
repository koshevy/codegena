services:
  verdaccio:
    image: verdaccio/verdaccio:7.1.2
    ports:
      - '127.0.0.1:4873:4873'
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:4873/-/ping']
      interval: 1s
      timeout: 3s
      retries: 15

  pull-request-act:
    profiles: [act]
    image: codegena-pull-request-act:local
    build:
      context: ./pull-request
      target: pull-request-act
  pull-request-runner:
    profiles: [github]
    image: codegena-pull-request-runner:local
    build:
      context: ./pull-request
      target: pull-request-runner
    init: true
    environment:
      RUNNER_NAME: ${RUNNER_NAME:-codegena-pull-request}
      RUNNER_REPOSITORY_URL: https://github.com/koshevy/codegena
    volumes:
      - pull-request-runner:/opt/actions-runner
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pull-request-runner:
